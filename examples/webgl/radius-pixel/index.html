<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link type="image/png" rel="icon" href="../../../assets/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="../../../styles.css" />
    <script src="./js/about-drag.js" defer></script>
    <script src="./js/about-webgl.js" defer></script>
    <title>Radial Pixel Shader | WebGL</title>
  </head>
  <body>
    <main>
      <a class="mdf-link back" href="../../../">Back to experiments</a>
      <h1 class="mdf-title3">Radial Pixel Shader</h1>
      <p>
        Shaders effect used on the home page of
        <a href="https://guillaumemeigniez.me" class="mdf-link"
          >guillaumemeigniez.me</a
        >.
      </p>
      <div class="form">
        <label for="intensity">
          Pixelization intensity
          <input type="range" id="intensity" value="10" min="0" max="25" />
          <span class="value" id="intensity-value">10</span>
        </label>
      </div>
      <div class="webgl" aria-hidden="true">
        <div class="side-img" id="side-image"></div>
        <div class="canvas">
          <canvas id="canvas"></canvas>
        </div>
      </div>
    </main>
  </body>
</html>
